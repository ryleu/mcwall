# Every option mcwall reads, with its default.
# Copy to ~/.config/mcwall/config.toml and change what you need; anything left
# out falls back to the default, so a two-line file is fine.

[location]
# Written by `mcwall init`. Drives sunrise, sunset and the weather fetch.
latitude = 34.7281
longitude = -86.5878
source = "ip"            # "ip" or "manual"

[library]
# Where builds are written, and where the display path looks by default: the
# directory of build directories, plus the manifest naming whichever build a
# render last completed.
# root = "~/.local/share/mcwall/library"
# Point this at one library directory to read it directly, wherever it lives
# — including a read-only /nix/store path. Set, it wins over root, so a
# finished render cannot change what is on screen. `mcwall use` writes it.
path = ""
root = "~/.local/share/mcwall/library"
# Match your monitor's native pixel size: `hyprctl monitors -j`.
width = 2880
height = 1800
format = "webp"
# 85 -> ~0.42 GB for the full grid, 90 -> ~0.62 GB, 95 -> ~1.1 GB.
quality = 90
# Deband on the way in. Dark frames use very little of the 8-bit range (a night
# sky spans ~18 of 255 luma levels), so gradients contour in any 8-bit format.
# gradfun interpolates and dithers across the bands; the dither is what hides
# them, so the output must be near-lossless or a lossy encode strips it back
# out. Costs about 8x the disk: 0.4 GB -> 3.2 GB for the full grid.
deband = true
near_lossless = 60

# The weather axis. Dropping "thunder" cuts 576 of the 1728 cells (a third)
# and costs nothing in correctness: a real thunderstorm degrades to the rain
# image through the normal fallback chain, logged as "weather thunder->rain".
weathers = ["clear", "rain", "thunder"]

[render]
prism_instance = "mc-wallpaper"
# Empty asks Prism: its active account, or the only one it has. Set a name to
# pin it — worth doing when a world already holds playerdata for one account.
prism_account = ""
shaderpack = "ComplementaryUnbound_r5.9.3.zip"
world = "mcwall-template"
# Frames rendered before each capture, so TAA, auto-exposure, clouds and
# volumetrics have settled. Check with scripts/repeatability.py: PSNR between
# two renders of the same job should be above 40 dB.
warmup_frames = 120
# The camera is NOT configured here. It is read from the world's own save, so
# the shot is moved by flying somewhere in-game and quitting — see
# `mcwall edit`. This file only changes how mcwall behaves, never what the
# pictures are of.
render_distance = 16
# Ticks the chunk counts must hold steady before a capture is allowed.
terrain_stable_ticks = 40
job_timeout_seconds = 180
allow_on_battery = false

# Empty: the camera comes from where you were standing, and a biome search
# would overrule its x and z. Name biomes to have the camera placed
# automatically instead — useful because Serene Seasons recolours broadleaf
# foliage strongly and conifers barely at all, so a taiga shot makes all
# twelve sub-seasons look alike apart from winter snow.
#   locate_biome = ["minecraft:forest", "minecraft:birch_forest", "minecraft:plains"]
locate_biome = []
locate_radius = 6000

# Winter renders in a snow-covered copy of the template. Snow is placed
# directly around the camera once, because vanilla snowfall would take about
# 17 minutes per world to cover render distance and would land randomly.
snow_soak_ticks = 2400
snow_random_tick_speed = 120
snow_season = "mid_winter"

[display]
fade_seconds = 2.5
weather_cache_seconds = 900     # 15 minutes
# Below this, `apply` returns before doing any work. How often the timer wakes
# is the home-manager module's `interval`, not a setting here.
low_battery_percent = 20
allow_loops_on_ac = true

# The 48 time slots. Two 3,000-tick twilight windows sit centred on vanilla's
# real horizon crossings (23215 and 12785), not on ticks 0 and 12000.
# `mcwall probe --write` replaces all of this with a measured [grid].slot_ticks
# list, which takes precedence when present.
[[grid.windows]]
name = "sunrise"
start = 21700
end = 700
slots = 12

[[grid.windows]]
name = "day"
start = 700
end = 11300
slots = 12

[[grid.windows]]
name = "sunset"
start = 11300
end = 14300
slots = 12

[[grid.windows]]
name = "night"
start = 14300
end = 21700
slots = 12
